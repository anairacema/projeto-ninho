<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ninho | Entrar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="form-page"><div class="form-top"><a class="logo" href="login.html"><img src="assets/logo.png" alt="Ninho" class="logo-img"></a></div><main class="login-wrap"><div class="login-card"><span class="login-flower">✿</span><h1>Que bom ter você de volta!</h1><p>Entre na sua conta para continuar cuidando de quem você ama.</p><form id="loginForm"><label>E-mail<input id="loginEmail" type="email" placeholder="voce@email.com" required></label><label>Senha<input type="password" placeholder="Sua senha" required></label><button class="primary-action" type="submit">Acessar</button></form><a href="cadastro-usuario.html">Criar minha conta</a></div></main><script>
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const p=JSON.parse(sessionStorage.getItem('ninhoCadastroResponsavel')||'{}');if(p.email&&p.email.toLowerCase()===document.getElementById('loginEmail').value.toLowerCase()){location.href='index.html'}else{alert('Este acesso é demonstrativo. Cadastre um usuário para testar o fluxo completo.')}});
</script></body></html>
